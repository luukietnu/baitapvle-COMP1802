<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Định dạng tổng hợp</title>
</head>
<body>
    <!--Bài tập soạn thảo trang 20 sách bài tập Thiết kế Web-->
    <h1 align="center"> CÔ GÁI HÁI MƠ </h1>
    <pre> 
        <!-- thẻ pre giữ nguyên định dạng văn bản như khi gõ trong mã nguồn, cố định vb khôn bị rớt dòng khi dộ rộng trình duyệt không đủ-->
        Thơ thẩn đường chiều một khách thơ,
        Say nhìn xa rặng núi xanh lơ,
        Khi trời lặng lẽ và trong trẻo,
        Thấp thoáng rừng mơ, <b>Cô hái mơ.</b>
        <u>Tác giả</u>:<i><s>Vô danh</s></i> <!--dùng thẻ <s> or <del> để gạch nganh vb-->
    </pre>
</body>
</html>
